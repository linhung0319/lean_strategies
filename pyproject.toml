[project]
name = "lean-strategies"
version = "0.1.0"
description = "LEAN Python ports of the sp500 SPY allocation strategies"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas==2.2.3",
    "wrapt==1.16.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "quantconnect-stubs",
]
# Not installed by default: run_local.py points LEAN's python-venv at this
# same .venv, so every package here also lands on the embedded interpreter's
# path. Only install it when you are actually converting data.
data = [
    "yfinance>=0.2.65",
]
# Same reasoning as `data`, and more of it: umap-learn pulls numba and
# llvmlite, ~150 MB that every other backtest would otherwise carry. Unlike
# `data` these are needed *during* a run, not before one -- algorithms/
# topological_portfolio.py imports them -- so a run of that strategy has to
# be `uv run --group topological run_local.py ...`.
topological = [
    "kmapper>=2.0",
    "scikit-learn>=1.5",
    "umap-learn>=0.5",
]

[tool.uv]
default-groups = ["dev"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["network: hits Yahoo Finance; deselected by default"]
addopts = "-m 'not network'"
